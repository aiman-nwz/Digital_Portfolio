<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aiman's Portfolio | Coming Soon</title>
    <link rel= 'icon' type="image/x-icon" href="/images/favicon.png">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'DM Mono', monospace;
            background: linear-gradient(135deg, #0f0657 0%, #2c294d 100%);
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .container {
            padding: 20px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        p {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 30px;
        }
        .links {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .btn {
            text-decoration: none;
            color: white;
            border: 2px solid white;
            padding: 10px 20px;
            border-radius: 5px;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        .btn:hover {
            background: white;
            color: #6c5ce7;
        }
        .badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">Something cool is being built 🚀</div>
        <h1><u>Aiman Nawaz</u></h1>
        <p>My new portfolio is currently under construction.<br>In the meantime, let's connect!</p>
        
        <div class="links">
            <a href="https://linkedin.com/in/aiman-nwz" class="btn">LinkedIn</a>
        </div>
    </div>
</body>
</html>
